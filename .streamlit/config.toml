# Paleta do design system do HerpIA (teal/areia — ver interface/tema.py,
# CORES, a fonte de verdade dos hex; não reinventar). Cobre o que o tema
# nativo do Streamlit consegue mexer (fundo, botões, controles);
# tipografia e o resto ficam em interface/tema.py (CSS injetado).
[theme]
primaryColor = "#0F4C5C"
backgroundColor = "#F8F6F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B2825"
font = "sans serif"
