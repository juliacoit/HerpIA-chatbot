# Paleta oficial do RAN/ICMBio (ver interface/tema.py, CORES, e
# design-system/tokens/colors.css — a fonte de verdade dos hex; não
# reinventar). Cobre o que o tema nativo do Streamlit consegue mexer
# (fundo, botões, controles); tipografia e o resto ficam em
# interface/tema.py (CSS injetado).
[theme]
primaryColor = "#4B7936"
backgroundColor = "#F6F7F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#23292A"
font = "sans serif"
