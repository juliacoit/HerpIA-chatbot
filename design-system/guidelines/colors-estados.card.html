<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:8px"><div style="padding:10px 14px;border-radius:var(--radius-md);background:var(--state-fundamentada-bg);color:var(--state-fundamentada-fg);font-size:14px;font-weight:600">Resposta fundamentada</div><div style="padding:10px 14px;border-radius:var(--radius-md);background:var(--state-retida-bg);color:var(--state-retida-fg);font-size:14px;font-weight:600">Resposta retida pela verificação</div><div style="padding:10px 14px;border-radius:var(--radius-md);background:var(--state-sem-evidencia-bg);color:var(--state-sem-evidencia-fg);font-size:14px;font-weight:600">Sem evidência suficiente na base</div><div style="padding:10px 14px;border-radius:var(--radius-md);background:var(--state-info-bg);color:var(--state-info-fg);font-size:14px;font-weight:600">Informação de sistema</div></div></body></html>
