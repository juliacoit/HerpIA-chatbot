<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div style="display:flex;flex-direction:column;gap:5px;min-width:86px"><div style="height:52px;border-radius:var(--radius-sm);background:var(--icmbio-verde-escuro);border:1px solid rgba(0,0,0,.08)"></div><div style="font-size:11px;font-weight:600">verde escuro</div><div class="mono">#006633</div></div><div style="display:flex;flex-direction:column;gap:5px;min-width:86px"><div style="height:52px;border-radius:var(--radius-sm);background:var(--icmbio-verde);border:1px solid rgba(0,0,0,.08)"></div><div style="font-size:11px;font-weight:600">verde</div><div class="mono">#339966</div></div><div style="display:flex;flex-direction:column;gap:5px;min-width:86px"><div style="height:52px;border-radius:var(--radius-sm);background:var(--icmbio-verde-claro);border:1px solid rgba(0,0,0,.08)"></div><div style="font-size:11px;font-weight:600">verde claro</div><div class="mono">#669933</div></div><div style="display:flex;flex-direction:column;gap:5px;min-width:86px"><div style="height:52px;border-radius:var(--radius-sm);background:var(--icmbio-amarelo);border:1px solid rgba(0,0,0,.08)"></div><div style="font-size:11px;font-weight:600">amarelo</div><div class="mono">#CCCC33</div></div><div style="display:flex;flex-direction:column;gap:5px;min-width:86px"><div style="height:52px;border-radius:var(--radius-sm);background:var(--icmbio-amarelo-escuro);border:1px solid rgba(0,0,0,.08)"></div><div style="font-size:11px;font-weight:600">amarelo esc.</div><div class="mono">#6E6E1A</div></div><div style="display:flex;flex-direction:column;gap:5px;min-width:86px"><div style="height:52px;border-radius:var(--radius-sm);background:var(--clay-700);border:1px solid rgba(0,0,0,.08)"></div><div style="font-size:11px;font-weight:600">clay 700</div><div class="mono">#8C3A2B</div></div></div><p class="mono" style="margin-top:12px">O clay não é institucional — mantido só para erro/negativo, que o manual (2009) não define.</p></body></html>
