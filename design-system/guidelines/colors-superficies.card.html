<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row" style="gap:12px"><div style="width:120px"><div style="height:44px;border-radius:var(--radius-sm);background:var(--surface-page);border:1px solid var(--border-hairline)"></div><div style="font-size:11px;font-weight:600;margin-top:5px">página</div><div class="mono">--surface-page</div></div><div style="width:120px"><div style="height:44px;border-radius:var(--radius-sm);background:var(--surface-card);border:1px solid var(--border-hairline)"></div><div style="font-size:11px;font-weight:600;margin-top:5px">card</div><div class="mono">--surface-card</div></div><div style="width:120px"><div style="height:44px;border-radius:var(--radius-sm);background:var(--surface-sunken);border:1px solid var(--border-hairline)"></div><div style="font-size:11px;font-weight:600;margin-top:5px">afundada</div><div class="mono">--surface-sunken</div></div><div style="width:120px"><div style="height:44px;border-radius:var(--radius-sm);background:var(--surface-tinted);border:1px solid var(--border-hairline)"></div><div style="font-size:11px;font-weight:600;margin-top:5px">tingida</div><div class="mono">--surface-tinted</div></div><div style="width:120px"><div style="height:44px;border-radius:var(--radius-sm);background:var(--surface-inverse);border:1px solid var(--border-hairline)"></div><div style="font-size:11px;font-weight:600;margin-top:5px">inversa</div><div class="mono">--surface-inverse</div></div>
<div style="width:150px;display:flex;flex-direction:column;gap:3px"><span style="color:var(--text-title);font-size:14px;font-weight:600">texto título</span><span style="color:var(--text-body);font-size:14px">texto corpo</span><span style="color:var(--text-muted);font-size:14px">texto secundário</span><span style="color:var(--text-subtle);font-size:14px">texto sutil</span></div></div></body></html>
