<!-- @dsCard group="Motion" viewport="700x170" name="Duração e easing" subtitle="Transições curtas, sem bounce; respeita prefers-reduced-motion" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><style>@keyframes slide{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(120px)}}.b{width:26px;height:26px;border-radius:var(--radius-pill);background:var(--teal-800)}</style>
<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:120px">fast 140ms</span><div class="b" style="animation:slide 1.4s var(--ease-standard) infinite alternate"></div></div><div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:120px">medium 220ms</span><div class="b" style="animation:slide 2.2s var(--ease-out) infinite alternate"></div></div><div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:120px">slow 360ms</span><div class="b" style="animation:slide 3s var(--ease-out) infinite alternate"></div></div></div></body></html>
