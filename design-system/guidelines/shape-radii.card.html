<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row" style="gap:16px"><div style="text-align:center"><div style="width:86px;height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-xs)"></div><div style="font-size:11px;font-weight:600;margin-top:5px">xs</div><div class="mono">4px</div></div><div style="text-align:center"><div style="width:86px;height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></div><div style="font-size:11px;font-weight:600;margin-top:5px">sm</div><div class="mono">8px</div></div><div style="text-align:center"><div style="width:86px;height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-md)"></div><div style="font-size:11px;font-weight:600;margin-top:5px">md</div><div class="mono">14px</div></div><div style="text-align:center"><div style="width:86px;height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-lg)"></div><div style="font-size:11px;font-weight:600;margin-top:5px">lg</div><div class="mono">20px</div></div><div style="text-align:center"><div style="width:86px;height:56px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-pill)"></div><div style="font-size:11px;font-weight:600;margin-top:5px">pill</div><div class="mono">999px</div></div></div></body></html>
