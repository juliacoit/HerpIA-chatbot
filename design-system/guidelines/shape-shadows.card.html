<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row" style="gap:18px;padding:6px 0"><div style="text-align:center"><div style="width:150px;height:78px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-card)"></div><div style="font-size:11px;font-weight:600;margin-top:8px">card</div><div class="mono">--shadow-card</div></div><div style="text-align:center"><div style="width:150px;height:78px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-raised)"></div><div style="font-size:11px;font-weight:600;margin-top:8px">raised</div><div class="mono">--shadow-raised</div></div><div style="text-align:center"><div style="width:150px;height:78px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-overlay)"></div><div style="font-size:11px;font-weight:600;margin-top:8px">overlay</div><div class="mono">--shadow-overlay</div></div></div></body></html>
