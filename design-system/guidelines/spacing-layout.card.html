<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}.lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);font-weight:600}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:var(--layout-gutter);height:130px"><div style="width:180px;background:var(--surface-sunken);border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:8px"><span class="lbl">sidebar 268px</span></div><div style="flex:1;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow-card)"><span class="lbl">conteúdo máx. 820px</span><p style="margin:8px 0 0;font-size:14px;line-height:1.6;max-width:44ch">A resposta nunca passa de 68 caracteres por linha — leitura longa de texto técnico.</p></div></div></body></html>
