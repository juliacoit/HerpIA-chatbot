<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>HerpIA — assistente RAN/ICMBio</title>
<link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box}html,body,#root{height:100%}body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}a{color:var(--text-link);text-decoration:none}a:hover{color:var(--text-link-hover)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="ConsultaScreen.jsx"></script>
<script type="text/babel" src="BuscaScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [autenticado,setAutenticado]=React.useState(true);
  const [tela,setTela]=React.useState('consulta');
  const [fontes,setFontes]=React.useState(['monitora','pans','salve']);
  const alternarFonte=(k)=>setFontes(f=>f.includes(k)?f.filter(x=>x!==k):[...f,k]);
  if(!autenticado) return <LoginScreen onEntrar={()=>setAutenticado(true)}/>;
  return (<div style={{height:'100%',display:'flex',overflow:'hidden'}}>
    <Sidebar tela={tela} onTela={setTela} fontes={fontes} onFonte={alternarFonte}/>
    {tela==='consulta'?<ConsultaScreen fontes={fontes}/>:<BuscaScreen fontes={fontes}/>}
  </div>);
}
const mount=()=>{ if(!window.Sidebar||!window.ConsultaScreen||!window.BuscaScreen||!window.LoginScreen) return setTimeout(mount,40);
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>); };
mount();
</script></body></html>
