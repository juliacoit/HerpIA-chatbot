      Chelonoidis com ficha no SALVE: C. denticulatus — Nacional Brasil 2024,
      Em Perigo (EN), critério A4cd; C. carbonarius — Nacional Brasil 2024,
      Vulnerável (VU), critério A4cd. Citações exibidas devem mostrar o
      Histórico de cada ficha.
    fontes_esperadas:
      - "salve | Chelonoidis denticulatus (Linnaeus, 1766) | conservacao (Histórico)"
      - "salve | Chelonoidis carbonarius (Spix, 1824) | conservacao (Histórico)"
