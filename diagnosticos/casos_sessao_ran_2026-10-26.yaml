# Proposta de casos de teste — sessão supervisionada com a equipe do RAN (26/10/2026)
#
# APENAS PROPOSTA: não integrar à suíte (scripts/teste_perguntas_dominio.py,
# avaliacao/casos.jsonl) nem ao RAGAS sem aprovação. Diagnóstico completo em
# diagnosticos/2026-11-04_sessao_supervisionada_ran.md.
#
# IDs seguem o padrão já usado nos diagnósticos (letra da categoria + número),
# continuando a numeração existente (A1–A3, B1–B3, F2–F7, H1–H2...). Categorias
# novas propostas:
#   M — vocabulário: nome popular, sinônimo taxonômico, termo alternativo
#   N — estrutura do documento: fronteira de chunk, tabela achatada, boilerplate
#   O — escopo temático (fora da herpetofauna; depende de decisão da equipe)
#   P — pergunta agregada sobre metadados (contagem/ranking)
#
# `comportamento_esperado` descreve o que o sistema deve fazer, incluindo o
# estado esperado na interface. Os fatos citados vêm do texto indexado das
# fichas/documentos, não de conhecimento externo, mas o gabarito final
# (`reference` no RAGAS) continua PENDENTE_VALIDACAO_RAN, como no resto do
# projeto. `fontes_esperadas` usa o nome do documento como está no payload,
# com a seção (SALVE) ou página (PDF).

casos:

  # ---------------------------------------------------------------- M — vocabulário
  - id: M1
    interacao: 786
    pergunta: "Quando foi a última avaliação do risco de extinção da Tracajá"
    comportamento_esperado: >
      Recuperar a ficha SALVE de Podocnemis unifilis (nome comum "Tracajá") e
      responder com o que ela diz: categoria atual Menos Preocupante (LC) e,
      no histórico, "Nacional Brasil 2018: Quase Ameaçada (NT)" e "Nacional
      Brasil 2012: NT". Não apresentar NT/2014 (PAN Quelônios 2017, citação
      ICMBio 2014) como avaliação mais recente. Estado: Fundamentada. Citações
      exibidas devem conter o Histórico.
    fontes_esperadas:
      - "salve | Podocnemis unifilis Troschel, 1848 | conservacao (Histórico de avaliação de risco)"
      - "salve | Podocnemis unifilis Troschel, 1848 | visao_geral (categoria atual)"
    comentario_equipe: >
      É prudente confirmar a atualização da informação no banco de dados, por
      conta da data da avaliação que consta na resposta (não tem de onde tirar
      o 2014). No entanto a estrutura e qualidade da resposta foi considerada
      pertinente.
    causa_raiz: >
      H3 — nome popular não traz a ficha (1º chunk de P. unifilis na posição
      18). Geração atribuiu a Bernardes et al. o ano "2014" do trecho do PAN.

