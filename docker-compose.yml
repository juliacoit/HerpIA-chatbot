version: "3.9"

# ============================================================
# Chatbot RAN/ICMBio — Serviços de infraestrutura local
# ============================================================
# Uso: copie .env.example para .env, ajuste as variáveis e rode:
#   docker compose up -d
#
# As portas ficam restritas a 127.0.0.1 (loopback).
# O acesso remoto do PC de desenvolvimento deve ser feito
# exclusivamente via túnel SSH — não altere isso sem revisar
# as implicações de segurança.
# ============================================================

services:

  postgres:
    image: postgres:16
    container_name: ran_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ran_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"   # HTTP / REST API
      - "127.0.0.1:6334:6334"   # gRPC
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
